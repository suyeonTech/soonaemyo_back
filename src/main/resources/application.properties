spring.application.name=soonaemyo-back
server.port=${PORT:8080}

# PostgreSQL (Railway 환경변수 자동 주입)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ROOT 관리자 시드 정보 (.env 파일에서 로드)
init.root-admin.login-id=${ROOT_ADMIN_LOGIN_ID}
init.root-admin.password=${ROOT_ADMIN_PASSWORD}
init.root-admin.name=${ROOT_ADMIN_NAME:Root Admin}

# CSRF (운영 환경에서는 활성화)
csrf.enabled=true
