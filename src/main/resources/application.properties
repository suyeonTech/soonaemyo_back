spring.application.name=soonaemyo-back

# H2
spring.datasource.url=jdbc:h2:mem:soonaemyo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ROOT 관리자 시드 정보 (.env 파일에서 로드)
init.root-admin.login-id=${ROOT_ADMIN_LOGIN_ID}
init.root-admin.password=${ROOT_ADMIN_PASSWORD}
init.root-admin.name=${ROOT_ADMIN_NAME:Root Admin}
